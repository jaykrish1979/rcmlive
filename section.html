<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCM Portal | Section</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <a href="/dashboard.html" class="logo-text">RCM Portal</a>
      <nav class="main-nav">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/help.html" class="nav-link">Help</a>
      </nav>
    </div>
    <div class="header-right">
      <span class="user-name" id="userName">—</span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="section-main">
    <div class="section-header">
      <a href="/dashboard.html" class="back-link">← Back to Dashboard</a>
      <h1 id="sectionTitle">Section</h1>
      <p id="sectionDesc"></p>
    </div>

    <div class="section-content" id="sectionContent">
      <!-- Checklists and content populated by JS -->
    </div>

    <div class="detail-table-block" id="detailTableBlock">
      <!-- Detail table populated by JS -->
    </div>

    <div class="issues-block" id="issuesBlock">
      <!-- Issues / alerts populated by JS -->
    </div>

    <div class="section-actions">
      <button class="btn-secondary" id="saveBtn">Save Progress</button>
      <button class="btn-primary" id="completeBtn">Mark as Complete & Continue</button>
    </div>
  </main>

  <script src="/js/protection.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/section.js"></script>
</body>
</html>
