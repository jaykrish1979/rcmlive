<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCM Portal | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <a href="/dashboard.html" class="logo-text">RCM Portal</a>
      <nav class="main-nav">
        <a href="/dashboard.html" class="nav-link active">Dashboard</a>
        <a href="/help.html" class="nav-link">Help</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="client-switch">
        <span class="client-label">Client</span>
        <select id="clientSelect"></select>
        <button class="btn-ghost small" id="addClientBtn" title="Add client">+</button>
      </div>
      <span class="user-name" id="userName">—</span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-graph-bg" aria-hidden="true">
      <svg viewBox="0 0 800 400" preserveAspectRatio="xMinYMin slice">
        <defs>
          <linearGradient id="chartGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="rgba(37, 99, 235, 0.06)"/>
            <stop offset="100%" stop-color="rgba(37, 99, 235, 0.02)"/>
          </linearGradient>
          <linearGradient id="chartGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="rgba(34, 197, 94, 0.05)"/>
            <stop offset="100%" stop-color="rgba(34, 197, 94, 0.01)"/>
          </linearGradient>
        </defs>
        <!-- Abstract bar chart shapes -->
        <rect x="40" y="280" width="60" height="120" rx="4" fill="url(#chartGrad1)"/>
        <rect x="120" y="220" width="60" height="180" rx="4" fill="url(#chartGrad1)"/>
        <rect x="200" y="160" width="60" height="240" rx="4" fill="url(#chartGrad1)"/>
        <rect x="280" y="200" width="60" height="200" rx="4" fill="url(#chartGrad1)"/>
        <rect x="360" y="140" width="60" height="260" rx="4" fill="url(#chartGrad2)"/>
        <rect x="440" y="100" width="60" height="300" rx="4" fill="url(#chartGrad2)"/>
        <rect x="520" y="160" width="60" height="240" rx="4" fill="url(#chartGrad2)"/>
        <rect x="600" y="120" width="60" height="280" rx="4" fill="url(#chartGrad2)"/>
        <rect x="680" y="180" width="60" height="220" rx="4" fill="url(#chartGrad1)"/>
        <!-- Subtle line trend -->
        <path d="M80 340 Q200 200 400 150 T720 120" fill="none" stroke="rgba(37, 99, 235, 0.08)" stroke-width="2"/>
      </svg>
    </div>
    <div class="dashboard-hero">
      <h1>Go-Live Plan</h1>
      <p>Complete each section in order. Your progress is saved automatically.</p>
      <div class="progress-ring-container">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="progress-ring-bg" cx="60" cy="60" r="54"/>
          <circle class="progress-ring-fill" cx="60" cy="60" r="54" id="progressCircle"/>
        </svg>
        <div class="progress-value" id="progressPercent">0%</div>
      </div>
    </div>

    <section class="client-stats" id="clientStats">
      <!-- Client summary cards populated by JS -->
    </section>

    <section class="client-chart-wrap" id="clientChartWrap">
      <h2>Clients by status</h2>
      <div class="status-bar" id="statusBar"></div>
      <div class="status-legend" id="statusLegend"></div>
    </section>

    <section class="issues-panel" id="issuesPanel">
      <h2>Open issues</h2>
      <div id="issuesList"></div>
    </section>

    <section class="sections-grid">
      <!-- Sections populated by JS -->
    </section>

    <div class="modal-backdrop" id="sectionModal" hidden>
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <p class="modal-phase" id="modalPhase"></p>
            <h2 id="modalTitle"></h2>
          </div>
          <button class="modal-close" id="modalClose" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>
  </main>

  <script src="/js/protection.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
